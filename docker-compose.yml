# Runs the two Sentinel services together. The gateway is the only public
# surface (port 8080, GitHub webhook). The model service is reachable only on
# the internal compose network at http://sentinel-model:9000 — never published,
# so it needs no auth of its own.
services:
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set in .env}
      MODEL_URL: http://sentinel-model:9000
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.90}
      SLOP_LABEL: ${SLOP_LABEL:-needs-human-review}
    depends_on:
      sentinel-model:
        # service_started, not service_healthy: the gateway must come up and fail
        # open (200, no action) when the model is absent or unhealthy (FR-007).
        # Waiting on health would couple the gateway's liveness to the model's.
        condition: service_started
    # CMD (not CMD-SHELL): distroless has no shell. The binary probes its own
    # /healthz via the -healthz flag (see cmd/sentinel/main.go).
    healthcheck:
      test: ["CMD", "/sentinel", "-healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  sentinel-model:
    build:
      context: ./model
      dockerfile: Dockerfile
    # Not published to the host — internal network access only.
    expose:
      - "9000"
    environment:
      MODEL_PATH: /app/model
      PORT: "9000"
    volumes:
      # Mount the fine-tuned artifact produced offline by ml/train.py.
      - ./model/model:/app/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # "no", not unless-stopped: a missing artifact makes the service exit(1) with
    # one clear message (see model/inference.py); restarting would just crash-loop
    # that same config error forever (FR-008). It stays stopped so the operator
    # sees the message and fixes the artifact. (docker compose up ignores a
    # max-retry count, so a bounded on-failure is not portable here.)
    # ponytail: no auto-recovery from a genuine transient model crash — acceptable
    # for this single-node scope; an orchestrator with bounded restarts is the
    # upgrade path if HA is ever needed.
    restart: "no"
